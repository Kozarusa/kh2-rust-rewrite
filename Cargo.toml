[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
kh2-iso = { path = "crates/kh2-iso" }
kh2-archive = { path = "crates/kh2-archive" }
kh2-bar = { path = "crates/kh2-bar" }
kh2-sheets = { path = "crates/kh2-sheets" }
kh2-tables = { path = "crates/kh2-tables" }
kh2-ps2 = { path = "crates/kh2-ps2" }
kh2-model = { path = "crates/kh2-model" }
kh2-anim = { path = "crates/kh2-anim" }
kh2-map = { path = "crates/kh2-map" }
kh2-ee = { path = "crates/kh2-ee" }
kh2-fx = { path = "crates/kh2-fx" }
kh2-audio = { path = "crates/kh2-audio" }
kh2-image = { path = "crates/kh2-image" }
kh2-bdx = { path = "crates/kh2-bdx" }
kh2-rig = { path = "crates/kh2-rig" }
kh2-factory = { path = "crates/kh2-factory" }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
