[package]
name = "kh2-app"
description = "kh2-rs game: Bevy application that runs on the user's own Kingdom Hearts II disc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kh2_app"
path = "src/lib.rs"

[[bin]]
name = "kh2-game"
path = "src/main.rs"

[dependencies]
kh2-game-core.workspace = true
kh2-sound.workspace = true
kh2-enemy.workspace = true
kh2-player.workspace = true
kh2-archive.workspace = true
kh2-model.workspace = true
kh2-anim.workspace = true
kh2-map.workspace = true
kh2-tables.workspace = true
kh2-fx.workspace = true
kh2-audio.workspace = true
kh2-ps2.workspace = true
kh2-bar.workspace = true
kh2-bdx.workspace = true
kh2-image.workspace = true
kh2-ard = { path = "../kh2-ard" }
bevy = "0.19"

[dev-dependencies]
# The oracle test of progress.rs runs the game's own new-game routines (PLAYBOOK R2).
kh2-ee.workspace = true
