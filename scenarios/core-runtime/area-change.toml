# The area change (WP-L1-P19, gate G3 of ladder step L1): the original and the port from one state, the same pad script, and the
# place record compared around the exit. State .06 is world 2 area 0x15 (tt21, the Mansion computer room, entrance 99). The pad
# script (area-change.pad) walks Roxas into the walk-in volume of the exit group "m_10" (area 17 = 0x11, entrance 1, gate 2; volume at
# (700, -147.5, -800), half extents 100 x 152.5 x 100) and keeps the stick up.
#
# What the original does (traced by `tools\rig.ps1 core-runtime/area-change -OriginalOnly`, the trace is local/rig/area-change/):
#   k 164  Roxas at (695, -10, -700), still in area 0x15 entrance 99 (his y has started to fall: the volume's walk-in)
#   k 166  place record 2/17/1: the area record is rewritten and the player object is gone (the pointer at 0x35c998 reads 0, so the rig's sora.pos is empty)
#   k 166 to 362  no player object: the load of tt17 (about 3.3 s)
#   k 364  the new player object stands at the entrance (-100.95, -10, 384.03) and runs up (z falls 16 per second vsync, the stick is up)
#
# Checks: the place before the exit (exact), the place at the rewrite and during the load (exact: the load timing is the point of
# the scenario), the player object absent during the load (an empty value on both sides) and present again from k 364, and the entrance
# position. The "programs" the area record also carries (0x33e833..5), the frozen frame under the fade and the music are NOT compared:
# the rig has no value names for them yet (values.toml and rig_values.rs belong to other packages: see the L1-P19 report).
# A failing row is a finding for agents/DEVIATIONS.md (the load timing of the port's area change), not a tool fault.
[scenario]
name = "area-change"
state = "06"
port_area = "tt21"
pad = "area-change.pad"
frames = 420

[seeds]
drive = 1
auto_limit = 1

[trace]
every = 2
values = ["place.world", "place.area", "place.entrance", "place.programs"]

[[check]]
at = [60, 100, 140, 160]
values = ["sora.pos"]
tol = { "sora.pos" = 8.0 }
informational = true
note = "the walk to the exit (the port's stick and camera differences show here first; informational, the place rows below are the check)"

[[check]]
at = [100, 140, 160, 164]
values = ["place.world", "place.area", "place.entrance"]
note = "still in the computer room (2/21/99) until the exit volume takes effect"

[[check]]
at = [166, 168, 200, 300, 362, 364, 380, 420]
values = ["place.world", "place.area", "place.entrance"]
note = "the area record is 2/17/1 from k 166 on the original; the port's timing of the rewrite is the finding"

[[check]]
at = [166, 200, 300, 362]
values = ["sora.pos"]
note = "no player object while the new area loads: the original's value is empty from k 166 to 362, so the port's must be empty too"

[[check]]
at = [364, 380, 420]
values = ["sora.pos"]
tol = { "sora.pos" = 4.0 }
note = "the player stands at the entrance of area 17 and runs up (z falls 8 per vsync)"

[[check]]
at = [100, 140, 160, 164, 166, 168, 200, 300, 362, 364, 380, 420]
values = ["place.programs"]
note = "the three program ids of the area record (map, btl, evt) around the exit: the original copies them from the program table when the area is entered (FUN_00104bd0)"
