# The frame step and the first tick of movement over 600 vsyncs (state .06, Mansion: Computer Room; WP-L1-P20, the L1 close-out
# scenario "frame-step-600" of docs/systems/core-runtime/runtime.md "Frame step").
#
# What it checks: the original's frame task (0x14ccf8, priority 800000, the last task of every pass) calls the frame step 0x14cdd0,
# which stores the step in 0x356f40: 2.0 in the field (frame type 1, limit 1, game speed 1.0: two vblanks per game frame, one pad stop
# per second vsync), whatever the input does. The port runs the same cadence since L1-P4 (schedule::FrameClock). The first tick of
# movement is the one DEVIATIONS 2026-10-23 names: the original moves a full 16 cm per game frame from the frame after the input frame,
# so Sora's position at k 42 (input written at k 40) is one full step along the stick direction.
#
# The frame counters: 0x356f38 (vblanks since the last step) reads 0 at every pad stop of the field in the original (the step resets it
# and the pad stop comes before the next wait ends) and the game speed 0x356f3c is 1.0; both are compared exactly at the even k of the
# checkpoints. The vblank counter 0x356f34 counts since init, so its absolute value depends on the session (the state's was 3368 at k 0
# in the recorded run): it is compared informationally here, and the real check is the rate, 1 per vsync (the original counted 580 from
# k 20 to k 600, the port the same). A gap of the port: it starts the counter at 0 and the step at 0 until its first frame completes,
# where the state carries 2.0 (k 0 of frame.step below), recorded in DEVIATIONS.
#
# Run by WP-RIG-G3: the original (PCSX2) trace is in local/rig/frame-step-600, the port ran in turbo.
[scenario]
name = "frame-step-600"
state = "06"
port_area = "tt21"
pad = "frame-step-600.pad"
frames = 600

[seeds]
drive = 1
auto_limit = 1

[trace]
every = 20
values = ["frame.step", "frame.vblanks", "frame.since_step", "frame.speed", "sora.pos"]

# The field's step is 2.0 at every checkpoint, before, during and after the run: the cadence does not depend on the input.
[[check]]
at = [0, 20, 40, 42, 60, 120, 122, 200, 300, 400, 500, 600]
values = ["frame.step"]
tol = { "frame.step" = 0.0 }
note = "limit 1, frame type 1, speed 1.0 gives 2.0 at every stop of the field"

# The first tick of movement: still at k 40 (the input of k 40 is not applied yet), a full game frame along the stick at k 42.
[[check]]
at = [0, 20, 40, 42, 44]
values = ["sora.pos"]
tol = { "sora.pos" = 2.0 }
note = "DEVIATIONS 2026-10-23: the original moves 16 cm in the first tick after the input; the port was 6.7 units off before L1-P4"

# After the stick is released the original stops in the first frame without input (RIG.md 1.2).
[[check]]
at = [120, 122, 124, 300, 600]
values = ["sora.pos"]
tol = { "sora.pos" = 2.0 }
informational = true
note = "the run of tt-run-06 differs from k 60 on (the port's wall and turn handling, DEVIATIONS); here the release is checked informationally"

# The counters at the pad stops: nothing is waiting for a vblank when the pad is read, and the speed is the default.
[[check]]
at = [20, 40, 60, 120, 200, 300, 400, 500, 600]
values = ["frame.since_step", "frame.speed"]
tol = { "frame.since_step" = 0.0, "frame.speed" = 0.0 }
note = "0x356f38 is 0 at every pad stop and 0x356f3c is 1.0 (the step resets the first; nothing changes the second in the field)"

[[check]]
at = [20, 100, 300, 600]
values = ["frame.vblanks"]
informational = true
note = "0x356f34 counts since init: the original's value is the state's counter (3368 at k 0 in the recorded run) plus k, the port's counts from 0; the rate (1 per vsync) is what both show"
