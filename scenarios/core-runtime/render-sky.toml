# Frame-part demonstration (WP-L1-RIGF): the sky of Twilight Town at dusk, original versus port, by screenshot. State .04 is world 2
# area 8 (tt08), Sora on the rooftop terrace with the sunset sky over the town behind the wall. No pad script: both sides idle (the
# fight around Sora is not compared: the shots mask it). The value checks only prove both sides stand in the same place.
#
# Shot "sky-band": everything is masked except a band of sky and cloud on the right of the picture (rig frame 640x448): the HUD
# bar, the buildings on the left and everything below the wall. Shot "full": the whole frame except the HUD bars. A failing score is
# a result (a finding about the port's drawn sky, fog, lighting or camera), not a tool fault; the diff pictures are in
# local/rig/render-sky/frames/.
[scenario]
name = "render-sky"
state = "04"
port_area = "tt08"
frames = 70

[seeds]
drive = 1
auto_limit = 1

[[check]]
at = [0]
values = ["place.world", "place.area", "place.entrance"]
note = "both sides start in the same place"

[[shot]]
at = 40
name = "sky-band"
mask = [[0, 0, 640, 70], [0, 70, 200, 138], [0, 208, 640, 240]]
tol = { ssim = 0.80, mad = 15.0 }

[[shot]]
at = 60
name = "full"
mask = [[0, 0, 640, 62], [0, 400, 640, 48]]
tol = { ssim = 0.70, mad = 25.0 }
