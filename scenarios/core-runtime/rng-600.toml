# The game's random number generator word over 600 frames of idle (state .06, Mansion: Computer Room). The original's word is the
# 64 bits at reent +0xa8 (scenarios/values.toml rng.lo / rng.hi, FUN_003117a8). The port starts from the state's word (`rig.rng` of the
# state file, written by `kh2 state from-p2s`) and steps it in every ported user (docs/systems/core-runtime/runtime.md "RNG").
# The original side was NOT traced when this file was written (WP-L1-P1: see the report): the first check is the state's own word at k 0
# (the port must start from the state's word, so it passes whenever the state file carries `rig.rng`); the later checks are
# informational, because the port steps the word only in the users it has ported while the original steps it in every user (effects,
# idle motions, NPC glances) [inferred], so the pair is expected to differ until those users are ported.
[scenario]
name = "rng-600"
state = "06"
port_area = "tt21"
pad = "rng-600.pad"
frames = 600

[seeds]
drive = 1
auto_limit = 1

[trace]
every = 20
values = ["rng.lo", "rng.hi"]

[[check]]
at = [0]
values = ["rng.lo", "rng.hi"]
note = "the state's word"

[[check]]
at = [20, 60, 120, 240, 360, 480, 600]
values = ["rng.lo", "rng.hi"]
informational = true
note = "draws since the state: the original's count of draws is every user's; the port's is the ported users' only"
