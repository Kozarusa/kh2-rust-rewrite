# The pause menu opens and closes (state .06). In the original the menu runs one game frame per vsync with frame step 1.0
# (local/specs/RIG.md 1.2); the k at which the step becomes 1.0 is the open tick the port's menu must match.
# Measured in the original (local/rig/camp-open-06, unlimited or normal speed alike): Start injected at k 200 and 202 (the field's last two
# stops, step 2.0); the step is 1.0 from k 203 (the first menu stop) to 380 and 2.0 again from k 382 (after the closing Start at 360..363).
# RIG-4 traced the menu values (scenarios/values.toml, docs/systems/ui/menus-pause.md 1.9): scene state 1 from k 203, phase 1 (the list
# takes input) from k 248, page 1 after the cross, back to page 0 after the circle.
[scenario]
name = "camp-open-06"
state = "06"
port_area = "tt21"
pad = "camp-open-06.pad"
frames = 400

[seeds]
drive = 1
auto_limit = 1

# Every stop (the field has one every second vsync, the menu one per vsync): where frame.step turns 1.0 is the open tick.
[trace]
every = 1
values = ["frame.step", "menu.scene_state", "menu.page", "menu.phase", "menu.cursor"]

# The page words (page, next page, phase, cursor, scroll) keep their last value in the original while no menu runs, so they are
# checked only at stops where the menu runs (k 260 and later, before the close); the scene words and Sora are checked around the
# open and the close too.
[[check]]
at = [202, 203, 382]
values = ["menu.scene_state", "menu.scene", "sora.pos", "sora.motion"]
note = "202 last field stop, 203 first menu stop; 382 first stop after the menu closed"

[[check]]
at = [260, 300, 340, 350]
values = ["menu.scene_state", "menu.scene", "menu.page", "menu.next_page", "menu.phase", "menu.closing", "menu.cursor", "menu.scroll"]
note = "260 main menu, 300 Items page, 340 back at the main menu, 350 before the closing Start (k 360)"

# The close: the original's Start at k 360 begins a return that ends at k 381 (scene state 3 for the last frames); the scene words
# are checked on the way out (the page words are stale or empty there).
[[check]]
at = [366, 372, 378, 380]
values = ["menu.scene_state", "menu.scene", "menu.closing"]
note = "the closing Start was pressed at k 360"

# The port keeps its own frame step (1.0 everywhere) until the frame step is ported (L1-P5); the original's is 2.0 in the field.
[[check]]
at = [202, 203, 260, 382]
values = ["frame.step"]
informational = true
