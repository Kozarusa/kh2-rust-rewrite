# Roxas runs (state .06, Mansion: Computer Room, world 2 area 0x15 entrance 99): stick up k 40..119, right k 120..199, still after.
# The original moves 16.00 cm per game frame, from the frame after the input frame (local/specs/RIG.md 1.2). Reference values read in
# the original: k 40 (650.00, 0, 250.00); 42 (636.54, 0, 241.34); 120 (117.47, 0, -104.95); 200 (103.68, 0, 488.57), still at 320;
# camera position at 320 (520.26, -220.00, 56.76).
[scenario]
name = "tt-run-06"
state = "06"
port_area = "tt21"
pad = "tt-run-06.pad"
frames = 330

[seeds]
drive = 1
auto_limit = 1

# Position and facing: even k only in the field (a stop every second vsync). 2 cm: a frame of latency is 16 cm and fails.
[[check]]
at = [40, 42, 60, 80, 120, 130, 160, 200, 202, 320]
values = ["sora.pos", "sora.facing"]
tol = { "sora.pos" = 2.0, "sora.facing" = 0.02 }
note = "the turn at 120 takes about 7 frames; facing differences show at 130"

# The original's frame step is 2.0; the port reports its own (1.0) until the frame step is ported (L1-P5).
[[check]]
at = [40, 120, 320]
values = ["frame.step"]
informational = true

[[check]]
at = [80, 160, 320]
values = ["cam.pos", "cam.look"]
tol = { "cam.pos" = 5.0, "cam.look" = 5.0 }
informational = true
note = "the port's camera is a stand-in in places (docs/camera.md)"
