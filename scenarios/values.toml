# Named values of the original's memory, read by the rig client at each checkpoint (crates/kh2-rig, docs in scenario.rs).
# A table that has `path` is a value; its name is the dotted table name. `path`: the first number is an absolute EE address, each
# further one is added to the pointer read at the one before. Addresses were read in the user's save states (local/specs/RIG.md 1.1);
# [inferred] marks what the values suggest but nothing proved. This file holds addresses and units only, no game data.

# The rig clock: the vsync counter (60 per second, also in menus). The client subtracts its value in the state to get k.
[clock.vsync]
path = [0x33fe64]
type = "u32"
unit = "vsync"
note = "saved in the state; the rig's k = this minus its value in the state"

# The field time step: 2.0 in the field (30 game frames per second), 1.0 in menus (60 per second); RIG.md 1.2.
[frame.step]
path = [0x356f40]
type = "f32"
unit = "frames"

# The current place: world, area, entrance, one byte each at 0x33e830..2.
[place.world]
path = [0x33e830]
type = "u8"

[place.area]
path = [0x33e831]
type = "u8"

[place.entrance]
path = [0x33e832]
type = "u8"

# 0 outside, 2 in the battle states of the user's set (RIG.md 1.1 table); meaning beyond that is not established.
[place.battle]
path = [0x1c8a7d8]
type = "u32"
note = "0 or 2 in the user's states; [inferred] the battle mode"

# Sora, through the player object pointer 0x35c998 (zero when no player object exists: the value is then empty).
[sora.object]
path = [0x35c998]
type = "u32"
note = "the pointer itself"

[sora.pos]
path = [0x35c998, 0x70]
type = "f32"
count = 3
unit = "cm"
note = "vec4 xyz(w=1) in the game's axes (y is up and negative)"

[sora.facing]
path = [0x35c998, 0x10]
type = "f32"
count = 3
unit = "unit vector"
note = "[inferred] equals minus the +0x60 row of the rotation; the facing"

# Sora's save-block record (the party block 0x33fec0, record size 0xf4): current and maximum HP bytes.
[save.sora_hp]
path = [0x33fec4]
type = "u8"
note = "member record +4; the save copy, not necessarily the live fight value"

[save.sora_hp_max]
path = [0x33fec5]
type = "u8"

# The camera object 0x355840 (docs/dynamic-tracing.md 5): wanted position +0x60, look-at +0x80.
[cam.pos]
path = [0x3558a0]
type = "f32"
count = 3
unit = "cm"

[cam.look]
path = [0x3558c0]
type = "f32"
count = 3
unit = "cm"

# Sora's motion (RIG-4, traced in state .06: walk, run, idle, attack; docs/systems/player-camera/contract.md, motion controller at
# object +0x140). The pointer 0x35c998 is the actor itself: +0x154 = controller +0x14, the motion id last requested (idle 0, walk 1,
# run 2, the first ground attack 151 in that state); +0x170 = controller +0x30, the playing motion's time in frames (2.0 per field
# frame, back to the loop start at the end, e.g. 40 for the run). Compare both exactly.
[sora.motion]
path = [0x35c998, 0x154]
type = "i32"
unit = "motion id"
note = "traced RIG-4: 0 idle, 1 walk (half stick), 2 run (full stick), 151 the attack of state .06"

[sora.motion_frame]
path = [0x35c998, 0x170]
type = "f32"
unit = "frames"
note = "traced RIG-4: restarts at 0 or the step on a new motion, +2 per field frame, wraps at the loop length (+0x16c [inferred])"

# The camp menu (RIG-4, traced in state .06 over the pages 0, 1, 0xa and 0xf; docs/systems/ui/menus-pause.md 1.4 and 1.9).
# Compare all exactly. The page words keep their last value while no menu runs: read them only while menu.scene_state is 1.
[menu.scene_state]
path = [0x33e764]
type = "i32"
note = "traced: 0 in the field, 1 from the first menu frame (k 203 in camp-open-06) to the close, 3 for the two closing frames"

[menu.scene]
path = [0x3b10d0]
type = "i32"
note = "traced: -1 in the field, 7 from the Start frame to the return (the scene requested by 0x1033a8)"

[menu.page]
path = [0x36d1d4]
type = "i32"
note = "traced: the current page (0 top list, 1 Items, 0xa Stock, 0xf Abilities); stale while closed"

[menu.next_page]
path = [0x36d1dc]
type = "i32"
note = "traced: the requested page during a page's leave animation, -1 otherwise"

[menu.phase]
path = [0x36d1e0]
type = "i32"
note = "traced: 0 entering, 1 selecting (the list takes input), 2 leaving"

[menu.closing]
path = [0x36d1f0]
type = "i32"
note = "traced: 1 from the closing cancel to the end of the menu; stale 1 in the field"

# The list widget of the current page: pointer 0x36ce9c (0 outside the menu), cursor row +0 and scroll +0x12 (s16, 0x2977a8).
[menu.cursor]
path = [0x36ce9c, 0x0]
type = "i16"
note = "traced: the row (a cell on the Stock grid) on screen; the index is cursor + scroll"

[menu.scroll]
path = [0x36ce9c, 0x12]
type = "i16"
note = "the list's first shown row (0 in every traced page) [inferred from 0x2977a8]"

# Read by the first pause-menu run of RIG.md 1.2; RIG-4: 0 at every stop of the field and of the menu runs, so not a menu value.
[menu.word_354f70]
path = [0x354f70]
type = "u32"
note = "0 in every user state and every stop of the RIG-4 menu runs (docs: the 0x138748 gate, 'a menu is up' outside the camp scene [inferred])"

# The game's random number generator word (generator A, FUN_003117a8): 64 bits at reent +0xa8, the reent pointer being the word at
# 0x373cf0 (the executable's pointer 0x373a00). Read as two words: the low half and the high half; the draw is bits 32..62 of the word.
# Every user of the generator steps it, so the pair is the count of draws since the seed in a moved state (boot seed 0x875b2f).
[rng.lo]
path = [0x373cf0, 0xa8]
type = "u32"
note = "low 32 bits of the generator word (reent +0xa8)"

[rng.hi]
path = [0x373cf0, 0xac]
type = "u32"
note = "high 32 bits of the generator word (reent +0xac); the draw is this word and 0x7fffffff"
